<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
/* Macro Bold (2026-11-10): white + bone, ink rules, Archivo heavy condensed. */
@font-face{font-family:'Archivo';src:url(../../prodani/assets/archivo-var-latin.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FFFFFF;color:#1A110C;font-family:'Archivo',sans-serif}
.card{position:relative;width:1200px;height:630px;overflow:hidden;box-sizing:border-box;border:6px solid #1A110C}
.d{font-weight:900;font-stretch:70%;text-transform:uppercase;letter-spacing:-.015em;line-height:.86}
.lbl{font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.wm{position:absolute;left:56px;top:44px}
.wm img{height:64px;display:block}
.panel{position:absolute;left:640px;top:0;right:0;bottom:0;background:#F3EEE6;border-left:6px solid #1A110C}
.big{position:absolute;left:52px;top:150px;font-size:210px}
.big small{font-size:.42em;margin-left:.04em;text-transform:none}
.big-l{position:absolute;left:58px;top:342px}
.name{position:absolute;left:56px;top:396px;margin:0;font-size:76px;width:570px;white-space:nowrap}
.name.long{font-size:60px;top:404px}
.price{position:absolute;left:56px;bottom:44px;background:#1A110C;color:#fff;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase;padding:18px 24px}
.price b{color:#FDC3D4}
.art{position:absolute;left:646px;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.art img{max-width:470px;max-height:500px;filter:drop-shadow(0 26px 34px rgba(26,17,12,.24))}
.art.tall img{transform:rotate(-8deg);max-height:520px}
.stamp{position:absolute;right:40px;bottom:40px;width:150px;height:150px;border-radius:50%;background:#FDC3D4;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:19px;letter-spacing:.1em;text-transform:uppercase;line-height:1.15;transform:rotate(-12deg)}
/* home */
.home .h{position:absolute;left:52px;top:138px;margin:0;font-size:104px;width:560px}
.home .h u{text-decoration:underline;text-decoration-color:#FDC3D4;text-decoration-thickness:.09em;text-underline-offset:.08em;text-decoration-skip-ink:none}
.home .meta{position:absolute;left:56px;bottom:44px}
.home .trio{position:absolute;left:646px;top:0;right:0;bottom:0}
.home .trio img{position:absolute;top:60px;height:440px;filter:drop-shadow(0 26px 34px rgba(26,17,12,.24))}
.home .trio img:nth-child(1){left:40px;transform:rotate(-8deg)}
.home .trio img:nth-child(2){left:200px;top:80px;transform:rotate(4deg)}
.home .trio img:nth-child(3){left:360px;transform:rotate(-3deg)}
</style></head>
<body>
<script>
const F=[
 {h:'dubai-dream-cake-copy',n:['Cherry','White'],c:'#C13A5A',bg:'#FBD9E0',img:'pd-cut-cherry-white.webp',tall:1,m:['20g protein','170 cal','4g sugar'],p:'$42.99'},
 {h:'personal-chocolate-fudge-cake-copy',n:['Dubai','Dream'],c:'#5F7230',bg:'#EBEFCB',img:'pd-cut-pistachio.webp',tall:1,m:['20g protein','180 cal','4g sugar'],p:'$42.99'},
 {h:'personal-hazelnuts-cake',n:['Hazelnut','Fudge'],c:'#9A5F2C',bg:'#F6E1C8',img:'pd-cut-hazelnut.webp',tall:1,m:['20g protein','180 cal','4g sugar'],p:'$42.99'},
 {h:'moist-chocolate-fudge-cake-copy',n:['Chocolate','Fudge'],c:'#5B3A2E',bg:'#EAD5C8',img:'pd-cut-choc-slices.webp',tall:0,m:['18g protein','150 cal','1g sugar'],p:'$37.99'},
 {h:'banana-bread-copy',n:['Banana','Bread'],c:'#8F6A0E',bg:'#FBEEC2',img:'pd-cut-banana-v.webp',tall:1,m:['16g protein','160 cal','11g sugar'],p:'$36.99'},
 {h:'cinnamon-apple-cake-copy',n:['Cinnamon','Apple'],c:'#94602C',bg:'#F6E4CC',img:'pd-cut-apple-v.webp',tall:1,m:['15g protein','120 cal','5g sugar'],p:'$38.99'},
 {h:'carrot-cake',n:['Carrot','Cake'],c:'#B9560F',bg:'#FBE2C9',img:'pd-cut-carrot-v.webp',tall:1,m:['15g protein','100 cal','3g sugar'],p:'$36.99'},
];
const i=new URLSearchParams(location.search).get('i');
if(i==='home'){
 document.body.innerHTML=`<div class="card home">
  <div class="panel"></div>
  <div class="wm"><img src="../../prodani/assets/prodani-wordmark.svg" alt="prodani"></div>
  <h1 class="title h d">20g protein. 0g added sugar. <u>It’s cake.</u></h1>
  <div class="meta lbl">Personal protein cakes · Miami</div>
  <div class="trio"><img src="../../prodani/assets/pd-cut-pistachio.webp" alt=""><img src="../../prodani/assets/pd-cut-cherry-white.webp" alt=""><img src="../../prodani/assets/pd-cut-hazelnut.webp" alt=""></div>
 </div>`;
}else{
 const f=F[+i];
 const pr=f.m[0].split('g')[0], rest=f.m.slice(1).join(' · ');
 document.body.innerHTML=`<div class="card">
  <div class="panel"></div>
  <div class="art ${f.tall?'tall':''}"><img src="../../prodani/assets/${f.img}" alt=""></div>
  <div class="wm"><img src="../../prodani/assets/prodani-wordmark.svg" alt="prodani"></div>
  <div class="big d">${pr}<small>g</small></div>
  <div class="big-l lbl">Protein · ${rest}</div>
  <h1 class="title name d ${(f.n[0]+f.n[1]).length>13?"long":""}">${f.n[0]} ${f.n[1]}</h1>
  <div class="price">5-pack <b>${f.p}</b></div>
  <div class="stamp">No added<br>sugar</div>
 </div>`;
}
document.title=i==='home'?'home':F[+i].h;
</script>
</body></html>
